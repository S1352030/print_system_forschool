<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影印計價後台管理系統</title>
  <script data-theme-bootstrap>(()=>{const e=sessionStorage.getItem('theme'),t=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',e==='dark'||(!e&&t));const s=['theme-blue','theme-green','theme-purple','theme-teal','theme-rose','theme-orange'];let a=sessionStorage.getItem('selected-palette');s.includes(a)||(a=s[Math.floor(Math.random()*s.length)],sessionStorage.setItem('selected-palette',a));document.documentElement.classList.add(a)})();</script>
  <link rel="stylesheet" href="/admin.css?v=20260730a">
  <link rel="stylesheet" href="/static/pdf-preview.css?v=20260730a">
</head>
<body>

<!-- SVG icon sprite (Material Symbols Outlined) -->

  <symbol id="i-refresh" viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></symbol>
  <symbol id="i-search" viewBox="0 -960 960 960"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></symbol>
  <symbol id="i-close" viewBox="0 -960 960 960"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></symbol>
  <symbol id="i-download" viewBox="0 -960 960 960"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></symbol>
  <symbol id="i-campaign" viewBox="0 -960 960 960"><path d="M720-440v-80h160v80H720Zm48 280-128-96 48-64 128 96-48 64Zm-80-480-48-64 128-96 48 64-128 96ZM200-200v-160h-40q-33 0-56.5-23.5T80-440v-80q0-33 23.5-56.5T160-600h160l200-120v480L320-360h-40v160h-80Zm240-182v-196l-98 58H160v80h182l98 58Zm120 36v-268q27 24 43.5 58.5T620-480q0 41-16.5 75.5T560-346ZM300-480Z"/></symbol>
</svg>

<header class="site-header">
  <div class="logo" aria-hidden="true"><svg class="admin-icon"><use href="#i-print"/></svg></div>
  <div>
    <h1>影印計價後台管理</h1>
    <small>Print Order Management System</small>
  </div>
  <button type="button" id="btn-refresh-orders" class="btn-refresh">
    <svg class="admin-icon" aria-hidden="true"><use href="#i-refresh"/></svg>重新整理
  </button>
</header>

<main class="admin-main">
<div class="stats-row">
  <div class="stat-card unpaid">
    <div class="stat-label">未付款總金額</div>
    <div class="stat-value" id="stat-unpaid">—</div>
    <div class="stat-sub" id="stat-unpaid-count">計算中…</div>
  </div>
  <div class="stat-card unprinted">
    <div class="stat-label">待列印頁數</div>
    <div class="stat-value" id="stat-unprinted">—</div>
    <div class="stat-sub" id="stat-unprinted-pages">計算中…</div>
  </div>
  <div class="stat-card total">
    <div class="stat-label">訂單總數</div>
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-sub" id="stat-total-sub">已載入</div>
  </div>
</div>

<section class="table-section" aria-labelledby="orders-title">
  <div class="section-header">
    <h2 class="section-title" id="orders-title">所有訂單</h2>
    <form id="order-search-form" class="order-search" role="search">
      <svg class="admin-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="order-search" type="search" maxlength="64" autocomplete="off"
             placeholder="搜尋姓名或訂單編號" aria-label="搜尋姓名或訂單編號">
    </form>
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>姓名</th>
          <th>檔案名稱</th>
          <th>頁數</th>
          <th>列印設定</th>
          <th>金額</th>
          <th>已付款</th>
          <th>已列印</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="order-tbody">
        <tr class="state-row"><td colspan="9"><span class="spinner"></span>載入訂單中…</td></tr>
      </tbody>
    </table>
  </div>
</section>

<section class="table-section gift-admin-section" aria-labelledby="gift-admin-title">
  <h2 class="section-title" id="gift-admin-title">禮物卡</h2>
  <p>在訂單按「收款」，輸入實收金額，多收的差額會自動轉成禮物卡。</p>
  <form id="gift-search-form" class="gift-admin-controls">
    <label for="gift-search">查詢代碼</label>
    <input id="gift-search" type="text" maxlength="64" autocomplete="off" placeholder="輸入完整代碼，留白顯示全部">
    <button class="btn-view-pdf" type="submit">查詢／重新整理</button>
  </form>
  <p id="gift-admin-status" role="status"></p>
  <div id="gift-card-list" class="gift-card-list"></div>
  <div class="gift-admin-controls">
    <button id="gift-prev" type="button" class="btn-outlined">上一頁</button>
    <span id="gift-page"></span>
    <button id="gift-next" type="button" class="btn-outlined">下一頁</button>
  </div>
</section>

<section class="announcement-section" aria-labelledby="announce-title">
  <h2 class="section-title" id="announce-title">系統公告管理</h2>
  <div class="announcement-layout">
    <div class="stat-card announcement-editor-card">
      <label class="stat-label" for="announce-input">發佈新公告</label>
      <textarea id="announce-input" rows="4" placeholder="請輸入公告內容..."></textarea>
      <button type="button" id="btn-publish-announce" class="btn-view-pdf">
        <svg class="admin-icon" aria-hidden="true"><use href="#i-campaign"/></svg>發布公告
      </button>
    </div>
    <div class="table-wrapper announcement-table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="w-50-percent">內容</th>
            <th>發佈時間</th>
            <th>顯示</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="announce-tbody">
          <tr class="state-row"><td colspan="4"><span class="spinner"></span>載入公告中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</main>

<dialog id="payment-dialog" class="finance-dialog" aria-labelledby="payment-title">
  <div class="finance-dialog-header"><h2 id="payment-title">確認收款</h2><button type="button" data-close-finance="payment-dialog" aria-label="關閉收款視窗"><svg class="admin-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <form id="payment-form">
    <p id="payment-summary"></p>
    <label for="payment-cash">實際收到的現金（元）</label>
    <input id="payment-cash" type="number" min="0" max="1000000" step="1" required inputmode="numeric">
    <label for="payment-note">備註（選填）</label>
    <input id="payment-note" type="text" maxlength="200" placeholder="例如：多付款保留至下次使用">
    <p id="payment-preview" role="status"></p>
    <button id="payment-submit" type="submit" class="btn-view-pdf">確認收款</button>
  </form>
  <div id="payment-result" role="status"></div>
</dialog>

<dialog id="gift-detail-dialog" class="finance-dialog" aria-labelledby="gift-detail-title">
  <div class="finance-dialog-header"><h2 id="gift-detail-title">禮物卡交易紀錄</h2><button type="button" data-close-finance="gift-detail-dialog" aria-label="關閉交易紀錄"><svg class="admin-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div id="gift-detail-body"></div>
  <div class="gift-admin-controls"><button id="gift-detail-prev" type="button" class="btn-outlined">上一頁</button><span id="gift-detail-page"></span><button id="gift-detail-next" type="button" class="btn-outlined">下一頁</button></div>
</dialog>

<dialog class="modal-backdrop" id="pdf-modal" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h3 id="modal-title">PDF 預覽</h3>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <div class="modal-header-actions">
        <button type="button" class="btn-download-pdf" id="btn-download-pdf"
                data-admin-pdf-download hidden><svg class="admin-icon" aria-hidden="true"><use href="#i-download"/></svg>下載 PDF</button>
        <button type="button" class="btn-close-modal" data-admin-pdf-close
                aria-label="關閉 PDF 預覽"><svg class="admin-icon" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
    </div>
    <div class="modal-settings" id="modal-settings"></div>
    <div id="admin-pdf-preview" class="pdf-preview" data-pdf-preview>
      <div class="modal-paper-bar pdf-preview__topline">
        <span class="paper-badge" data-pdf-paper>—</span>
        <span class="pdf-preview__status" data-pdf-status role="status" aria-live="polite"></span>
        <span class="modal-fit-toggle" title="切換預覽模式，僅供預覽，不影響訂單設定">
          <button type="button" id="admin-fit-btn" aria-pressed="false">留白</button>
          <button type="button" id="admin-cover-btn" aria-pressed="false">裁切</button>
        </span>
      </div>
      <progress class="pdf-preview__progress" data-pdf-progress aria-label="PDF 載入進度" hidden></progress>
      <div class="pdf-preview__viewport" data-pdf-viewport tabindex="0"
           aria-label="PDF 預覽區，可用左右方向鍵或滑動翻頁">
        <div class="pdf-a4-frame" data-pdf-frame>
          <canvas data-pdf-canvas aria-label="PDF 預覽"></canvas>
          <div class="pdf-doc-outline" data-pdf-doc-outline aria-hidden="true">
            <span class="pdf-doc-label" data-pdf-doc-label></span>
          </div>
          <div class="pdf-a4-label" data-pdf-a4-label aria-hidden="true">A4 · 210×297mm</div>
        </div>
      </div>
      <div class="pdf-preview__controls" aria-label="PDF 預覽控制">
        <button type="button" class="pdf-preview__icon-button" data-pdf-prev aria-label="上一頁">◀</button>
        <label class="pdf-preview__page-field">
          <span class="visually-hidden">目前頁碼</span>
          <input data-pdf-page type="number" min="1" value="1" inputmode="numeric">
          <span aria-hidden="true">/</span>
          <span data-pdf-count aria-label="總頁數">1</span>
        </label>
        <button type="button" class="pdf-preview__icon-button" data-pdf-next aria-label="下一頁">▶</button>
        <label class="pdf-preview__select">
          <span class="visually-hidden">縮放比例</span>
          <select data-pdf-zoom aria-label="縮放比例">
            <option value="fit">符合畫面</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
        </label>
        <button type="button" class="pdf-preview__text-button" data-pdf-boundary
                aria-label="顯示列印邊界" aria-pressed="false">邊界</button>
      </div>
      <div class="pdf-preview__error" data-pdf-error role="alert" hidden>
        <span data-pdf-error-message></span>
        <div class="pdf-preview__error-actions">
          <button type="button" class="pdf-preview__text-button" data-pdf-retry>重新載入</button>
          <a class="pdf-preview__text-button" data-pdf-download hidden>下載原始 PDF</a>
        </div>
      </div>
    </div>
  </div>
</dialog>

<div id="toast-container"></div>

<script type="module" src="/static/js/admin/app.js?v=20260730a"></script>

</body>
</html>
