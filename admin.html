<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影印計價後台管理系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/admin.css?v=20260730a">
  <link rel="stylesheet" href="/static/pdf-preview.css?v=20260730a">
  <script src="/static/dialog.js"></script>
</head>
<body>

<header class="site-header">
  <div class="logo">🖨</div>
  <div>
    <h1>影印計價後台管理</h1>
    <small>Print Order Management System</small>
  </div>
  <button class="btn-refresh" onclick="loadOrders()">↻ 重新整理</button>
</header>

<div class="stats-row">
  <div class="stat-card unpaid">
    <div class="stat-label">未付款總金額</div>
    <div class="stat-value" id="stat-unpaid">—</div>
    <div class="stat-sub" id="stat-unpaid-count">計算中…</div>
  </div>
  <div class="stat-card unprinted">
    <div class="stat-label">待列印份數</div>
    <div class="stat-value" id="stat-unprinted">—</div>
    <div class="stat-sub" id="stat-unprinted-pages">計算中…</div>
  </div>
  <div class="stat-card total">
    <div class="stat-label">訂單總數</div>
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-sub" id="stat-total-sub">已載入</div>
  </div>
</div>

<div class="announcement-section">
  <div class="section-title">系統公告管理</div>
  <div class="row g-3">
    <!-- Left: Publish Form -->
    <div class="col-md-5">
      <div class="stat-card announcement-editor-card">
        <div>
          <label class="stat-label" for="announce-input">發佈新公告</label>
          <textarea id="announce-input" class="form-control" rows="4" placeholder="請輸入公告內容..."></textarea>
        </div>
        <button id="btn-publish-announce" class="btn-view-pdf" onclick="publishAnnouncement()">
          📢 發布公告
        </button>
      </div>
    </div>
    <!-- Right: Announcement List -->
    <div class="col-md-7">
      <div class="table-wrapper announcement-table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="w-50-percent">內容</th>
              <th>發佈時間</th>
              <th>顯示</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="announce-tbody">
            <tr class="state-row"><td colspan="4"><span class="spinner"></span>載入公告中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="table-section">
  <div class="section-title">所有訂單</div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>姓名</th>
          <th>檔案名稱</th>
          <th>頁數</th>
          <th>列印設定</th>
          <th>金額</th>
          <th>已付款</th>
          <th>已列印</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="order-tbody">
        <tr class="state-row"><td colspan="9"><span class="spinner"></span>載入訂單中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<dialog class="modal-backdrop" id="pdf-modal" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h3 id="modal-title">PDF 預覽</h3>
        <div class="modal-meta" id="modal-meta"></div>
      </div>
      <div class="modal-header-actions">
        <button type="button" class="btn-download-pdf" id="btn-download-pdf"
                data-admin-pdf-download hidden>📥 下載 PDF</button>
        <button type="button" class="btn-close-modal" data-admin-pdf-close
                aria-label="關閉 PDF 預覽">✕</button>
      </div>
    </div>
    <div class="modal-settings" id="modal-settings"></div>
    <div id="admin-pdf-preview" class="pdf-preview" data-pdf-preview>
      <div class="modal-paper-bar pdf-preview__topline">
        <span class="paper-badge" data-pdf-paper>—</span>
        <span class="pdf-preview__status" data-pdf-status role="status" aria-live="polite"></span>
        <span class="modal-fit-toggle" title="切換預覽模式，僅供預覽，不影響訂單設定">
          <button type="button" id="admin-fit-btn" aria-pressed="false">留白</button>
          <button type="button" id="admin-cover-btn" aria-pressed="false">裁切</button>
        </span>
      </div>
      <progress class="pdf-preview__progress" data-pdf-progress aria-label="PDF 載入進度" hidden></progress>
      <div class="pdf-preview__viewport" data-pdf-viewport tabindex="0"
           aria-label="PDF 預覽區，可用左右方向鍵或滑動翻頁">
        <div class="pdf-a4-frame" data-pdf-frame>
          <canvas data-pdf-canvas aria-label="PDF 預覽"></canvas>
          <div class="pdf-doc-outline" data-pdf-doc-outline aria-hidden="true">
            <span class="pdf-doc-label" data-pdf-doc-label></span>
          </div>
          <div class="pdf-a4-label" data-pdf-a4-label aria-hidden="true">A4 · 210×297mm</div>
        </div>
      </div>
      <div class="pdf-preview__controls" aria-label="PDF 預覽控制">
        <button type="button" class="pdf-preview__icon-button" data-pdf-prev aria-label="上一頁">◀</button>
        <label class="pdf-preview__page-field">
          <span class="visually-hidden">目前頁碼</span>
          <input data-pdf-page type="number" min="1" value="1" inputmode="numeric">
          <span aria-hidden="true">/</span>
          <span data-pdf-count aria-label="總頁數">1</span>
        </label>
        <button type="button" class="pdf-preview__icon-button" data-pdf-next aria-label="下一頁">▶</button>
        <label class="pdf-preview__select">
          <span class="visually-hidden">縮放比例</span>
          <select data-pdf-zoom aria-label="縮放比例">
            <option value="fit">符合畫面</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
            <option value="2">200%</option>
          </select>
        </label>
        <button type="button" class="pdf-preview__text-button" data-pdf-boundary
                aria-label="顯示列印邊界" aria-pressed="false">邊界</button>
      </div>
      <div class="pdf-preview__error" data-pdf-error role="alert" hidden>
        <span data-pdf-error-message></span>
        <div class="pdf-preview__error-actions">
          <button type="button" class="pdf-preview__text-button" data-pdf-retry>重新載入</button>
          <a class="pdf-preview__text-button" data-pdf-download hidden>下載原始 PDF</a>
        </div>
      </div>
    </div>
  </div>
</dialog>

<div id="toast-container"></div>

<script type="module" src="/static/js/admin/app.js?v=20260730a"></script>

</body>
</html>
