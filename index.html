  <!-- PDF.js 改為延遲載入:僅在實際預覽 PDF 時才透過 pdfjs-loader.js 動態注入,
       避免首屏被 515KB 的 pdf.js 同步阻塞。 -->
  <script>
    (function() {
      // 1. Dark/Light mode theme
      const savedTheme = sessionStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      // 2. Random color palette theme
      const palettes = ['theme-blue', 'theme-green', 'theme-purple', 'theme-teal', 'theme-rose', 'theme-orange'];
      let selectedPalette = sessionStorage.getItem('selected-palette');
      if (!selectedPalette || !palettes.includes(selectedPalette)) {
        selectedPalette = palettes[Math.floor(Math.random() * palettes.length)];
        sessionStorage.setItem('selected-palette', selectedPalette);
      }
      document.documentElement.classList.add(selectedPalette);
    })();
  </script>
  <script src="/static/dialog.js"></script>

</head>

<div class="page-wrapper">


  <!-- Left: Form & History Panel -->
  <div class="md3-card">
    <div class="header">
      <h1 id="page-title">自助影印上傳</h1>
      <p id="page-subtitle">請填寫資料並設定列印選項</p>
    </div>

    <!-- M3 Tabs -->
    <div class="md3-tabs">
      <div class="md3-tab active" id="tab-upload" onclick="switchTab('upload')">
        <span class="material-symbols-outlined"><svg><use href="#i-upload_file"/></svg></span>
        <span>檔案上傳</span>
        <div class="md3-tab-indicator"></div>
      </div>
      <div class="md3-tab" id="tab-history" onclick="switchTab('history')">
        <span class="material-symbols-outlined"><svg><use href="#i-history"/></svg></span>
        <span>歷史訂單</span>
        <div class="md3-tab-indicator"></div>
      </div>
    </div>

    <!-- Panel 1: Upload Form -->
    <div id="upload-panel">
      <form id="uploadForm">
        <!-- 上傳冷卻提示橫幅 -->
        <div id="cooldown-banner" class="cooldown-banner hidden">
          <span class="material-symbols-outlined cooldown-spinner"><svg><use href="#i-hourglass_empty"/></svg></span>
          <span id="cooldown-banner-text">上傳已完成！為避免重複提交，系統冷卻中，請稍候 7 秒...</span>
        </div>

        <div class="md3-text-field">
          <input type="text" id="user_name" name="user_name" placeholder=" " required>
          <label for="user_name">您的姓名或學號</label>
        </div>

        <label class="file-upload-container" id="drop-area">
          <span class="material-symbols-outlined"><svg><use href="#i-upload_file"/></svg></span>
          <p>點擊選擇 PDF 檔案<br>或將檔案拖曳至此處</p>
          <input type="file" id="pdf_file" name="file" accept="application/pdf" multiple>
        </label>

        <div id="file-list-container" class="hidden">
          <div class="file-pager-header">
            <div class="section-label">已選擇的檔案 (最多 5 個)</div>
            <div class="file-pager-bar">
              <button type="button" class="pager-arrow-btn" id="file-pager-prev" onclick="changeActiveFile(-1)">
                <span class="material-symbols-outlined"><svg><use href="#i-chevron_left"/></svg></span>
              </button>
              <span class="file-pager-indicator" id="file-pager-info">1 / 1</span>
              <button type="button" class="pager-arrow-btn" id="file-pager-next" onclick="changeActiveFile(1)">
                <span class="material-symbols-outlined"><svg><use href="#i-chevron_right"/></svg></span>
              </button>
            </div>
          </div>
          <div id="pager-warning-message" class="pager-warning hidden">⚠️ 請檢查並填寫所有檔案的裝訂說明</div>
          <div id="selected-files-list">
            <!-- 已選擇的檔案清單 -->
          </div>
        </div>




        <div class="md3-text-field mb-24">
          <input type="text" id="pickup_location" name="pickup_location" placeholder=" " maxlength="100" required>
          <label for="pickup_location">你要什麼時候拿? (例如: 明天中午、下午3點，限20字)</label>
          <div id="pickup-error">⚠️ 抱歉，輸入字數最多只能 20 個字喔！</div>
        </div>

        <!-- 即時試算金額 -->
        <div id="price-summary" class="price-summary-card hidden">
          <div class="price-header">
            <span class="material-symbols-outlined"><svg><use href="#i-calculate"/></svg></span>
            <span>預估金額試算</span>
          </div>
          <div id="price-breakdown"></div>
          <div class="price-divider"></div>
          <div class="price-total-row">
            <span>結算總金額</span>
            <span class="total-amount" id="price-total-amount">NT$ 0 元</span>
          </div>
          <div class="price-pending hidden" id="price-pending-hint">⏳ 部分檔案頁數計算中，金額可能更新...</div>
        </div>

        <button type="submit" class="md3-btn-filled" id="submit-btn" disabled>
          <span class="material-symbols-outlined btn-icon-svg"><svg><use href="#i-send"/></svg></span>
          <span id="btn-text">確認上傳</span>
          <div id="btn-spinner" class="spinner hidden"></div>
        </button>

        <!-- 上傳進度條(M3.4 新增)-->
        <div id="upload-progress-bar" class="upload-progress-bar hidden">
          <div class="upload-progress-track">
            <div id="upload-progress-fill" class="upload-progress-fill"></div>
          </div>
          <span id="upload-progress-text" class="upload-progress-text">0%</span>
        </div>
      </form>
    </div>

    <!-- Panel 2: History Query -->
    <div id="history-panel" class="hidden">
      <div class="md3-text-field">
        <input type="text" id="history_search_name" placeholder=" ">
        <label for="history_search_name">請輸入您的姓名或學號</label>
      </div>
      <button type="button" class="md3-btn-filled" id="history-search-btn">
        <span class="material-symbols-outlined btn-icon-svg"><svg><use href="#i-search"/></svg></span>
        <span>開始查詢訂單</span>
      </button>

      <div id="history-loading" class="hidden">
        <div class="spinner"></div>
        <p>查詢中，請稍後...</p>
      </div>

      <div id="history-empty" class="hidden">
        <span class="material-symbols-outlined"><svg><use href="#i-search_off"/></svg></span>
        <span>找不到您的歷史訂單紀錄</span>
      </div>

      <div id="history-list" class="hidden">
        <!-- Dynamically populated -->
      </div>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-column">
    <!-- PDF Preview -->
    <div class="preview-card flex-1">
      <h2>
        <span class="material-symbols-outlined"><svg><use href="#i-preview"/></svg></span>
        PDF 預覽
      </h2>
      <div class="pdf-placeholder" id="pdf-placeholder">
        <span class="material-symbols-outlined"><svg><use href="#i-picture_as_pdf"/></svg></span>
        <span>選擇 PDF 後顯示預覽</span>
      </div>
      <div id="pdf-preview-container" class="hidden" style="position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; min-height: 400px; background: var(--bg-card); border-radius: 8px; overflow: hidden;">
        <div style="flex: 1; overflow: auto; width: 100%; display: flex; justify-content: center; align-items: flex-start; padding: 10px;">
          <div id="pdf-a4-frame" class="pdf-a4-frame">
            <canvas id="pdf-canvas"></canvas>
