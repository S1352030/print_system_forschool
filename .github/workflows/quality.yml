name: Project quality

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
  schedule:
    # Monday 09:00 Asia/Taipei
    - cron: '0 1 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full regression and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENSPEC_TELEMETRY: '0'
      REQUIRE_WEBKIT: '1'
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_RECEIVER_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r requirements-dev.txt
          python -m pip check
          npx --no-install playwright install --with-deps chromium webkit
      - name: Select change comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            echo "QUALITY_BASE_REF=$PR_BASE" >> "$GITHUB_ENV"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$PUSH_BASE^{commit}"; then
            echo "QUALITY_BASE_REF=$PUSH_BASE" >> "$GITHUB_ENV"
          fi
      - name: Full quality gate
        run: npm run check
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}
          path: .quality-reports/
          if-no-files-found: warn
          retention-days: 30
